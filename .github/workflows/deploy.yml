name: Deploy site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Restore previously-rendered preview images so each deploy only renders
      # haikus added since the last haiku.txt change (slugs are immutable).
      - name: Cache preview images
        uses: actions/cache@v4
        with:
          path: site/h
          key: og-images-v2-${{ hashFiles('haiku.txt') }}
          restore-keys: og-images-v2-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Build site (json, permalinks, preview images)
        run: python3 scripts/build-site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      # GitHub Pages' publish step intermittently returns "Deployment failed,
      # try again later" — a transient backend error unrelated to the build.
      # Try once, wait, then retry so a hiccup doesn't need a manual re-run.
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 15

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        with:
          timeout: 600000
          error_count: 15
