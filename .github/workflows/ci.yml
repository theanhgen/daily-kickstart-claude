name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Minimal default token; the deploy job elevates its own scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Cancel superseded CI on the same ref; safe (no external side effects).
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Shell unit tests
        run: bash tests/run.sh

      - name: Shellcheck
        run: shellcheck scripts/*.sh cron/*.sh tests/run.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python unit tests
        run: python3 tests/test_build_site.py

      - name: JS unit tests
        run: node --test tests/test_main.js

      # Full-archive parse of the real haiku.txt (no Pillow: pages-only path).
      - name: Build-site smoke test
        run: python3 scripts/build-site.py

      # No-op until NOTIFY_NTFY_TOPIC secret is set; then pushes an ntfy alert.
      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NOTIFY_NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NOTIFY_NTFY_TOKEN }}
          NTFY_HOST: ${{ secrets.NOTIFY_NTFY_HOST }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NOTIFY_NTFY_TOPIC secret unset; skipping notification"
            exit 0
          fi
          host="${NTFY_HOST:-https://ntfy.sh}"
          args=(-fsS -H "Title: CI failed on ${GITHUB_REF_NAME}" -H "Priority: 5" -H "Tags: daily-kickstart")
          [ -n "$NTFY_TOKEN" ] && args+=(-H "Authorization: Bearer $NTFY_TOKEN")
          printf 'CI failed on %s\n%s' "$GITHUB_REF_NAME" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | curl "${args[@]}" -d @- "$host/$NTFY_TOPIC" || true

  deploy:
    needs: test
    # needs: test already gates on success; this restricts publishing to main
    # (skips PRs and non-main dispatches). No status function, so a failed test
    # skips deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    # Pages group, but never cancel an in-flight publish mid-deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Restore previously-rendered preview images so each deploy only renders
      # haikus added since the last haiku.txt change (slugs are immutable).
      - name: Cache preview images
        uses: actions/cache@v4
        with:
          path: site/h
          key: og-images-v2-${{ hashFiles('haiku.txt') }}
          restore-keys: og-images-v2-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Build site (json, permalinks, preview images)
        run: python3 scripts/build-site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      # GitHub Pages' publish step intermittently returns "Deployment failed,
      # try again later" — a transient backend error unrelated to the build.
      # Try once, wait, then retry so a hiccup doesn't need a manual re-run.
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
        with:
          timeout: 600000
          error_count: 15

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        with:
          timeout: 600000
          error_count: 15

      # Fires only if the job failed (i.e. the retry also failed), never on the
      # self-healing first-attempt hiccup. No-op until the ntfy secret is set.
      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NOTIFY_NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NOTIFY_NTFY_TOKEN }}
          NTFY_HOST: ${{ secrets.NOTIFY_NTFY_HOST }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NOTIFY_NTFY_TOPIC secret unset; skipping notification"
            exit 0
          fi
          host="${NTFY_HOST:-https://ntfy.sh}"
          args=(-fsS -H "Title: Pages deploy failed" -H "Priority: 5" -H "Tags: daily-kickstart")
          [ -n "$NTFY_TOKEN" ] && args+=(-H "Authorization: Bearer $NTFY_TOKEN")
          printf 'Pages deploy failed after retry.\n%s' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | curl "${args[@]}" -d @- "$host/$NTFY_TOPIC" || true
